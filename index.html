	body {
		margin: 0;
		font-family: Arial, sans-serif;
		display: flex;

	.sidebar {
		width: 250px;
		color: #dbe9f4;
		padding: 20px;
		display: flex;
		flex-direction: column;
		gap: 5px;
		position: absolute;
		transition: transform 0.3s ease;
		transform: translateX(-100%);
	}

	.sidebar.open {
		position: relative;
		background-color: #dbe9f4;
		box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
		border-radius: 10px;
		margin-top: 80px;
		z-index: 0;
		height: 90%;
		transform: translateX(0);
		transition: transform 0.5 ease;
	}

	.sidebar.closed {
		transform: translateX(-100%);
		background-color: #dbe9f4;
	}

	.sidebar a {
		text-decoration: none;
		width: 100%;
		color: #000;
		padding: 10px;
		display: block;
		border-radius: 5px;
		text-align: left;
		transition: 0.3s;
	}

	.sidebar a.active {
		background-color: #ff6738;
		color: white;
	}

	.sidebar a:hover {
		background: #ff6738;
		width: 100%;
	}

	.content1 {
		flex-grow: 1;
		display: flex;
		flex-direction: column;
		width: calc(100% - 250px);
	}

	.sidebar.closed~.content1 {
		width: 100%;
	}

	iframe {
		width: 100%;
		height: 100%;
		border: none;
	}

	.sidebar.closed~.content1 iframe {

	nav li {

	.social {

		align-items: center;
		gap: 10px;
		padding: 10px;
		border-radius: 5px;
	}

	.social img {
		width: 30px;
		height: 30px;
	}

	.navbar {
		display: flex;
		justify-content: space-around;
		align-items: center;
		min-height: 6vh;
		width: 30%;
		flex-wrap: wrap;
		gap: 8px;
		font-family: "Poppins", sans-serif;
		border-bottom: 2px #ff6738;
	}

	.navbar a {
		color: #333;
		text-decoration: none;
		font-weight: bold;
		font-size: 18px;
		display: inline-flex;
		justify-content: space-around;
		position: relative;
		padding: 10px;
		transition: background-color 2s ease;
	}

	.navbar a::after {
		content: "";
		position: absolute;
		left: 0;
		bottom: -5px;
		width: 0;
		height: 2px;
		background-color: #ff6738;
		transition: width 0.5s ease;
	}

	.sidebar i {
		margin-right: 15px;
	}

	.navbar a:hover {
		background-color: #ff6738;
		border-radius: 5px;
	}

	.navbar a:hover::after {
		width: 100%;
	}

	.menu-toggle {
		position: absolute;
		cursor: pointer;
		left: 2%;
		font-size: 27px;
		background-color: #dbe9f4;
		border-radius: 1px solid #000;

    <script>
        function loadPage(url) {
          document.getElementById("page-frame").src = url;
        }
  
        function toggleSidebar() {
          const sidebar = document.querySelector('.sidebar');
          const content = document.querySelector('.content1');
          sidebar.classList.toggle('open');
          content.classList.toggle('closed');
        }
  
        // Function to highlight the active link
        function setActiveLink(link) {
          const links = document.querySelectorAll('.sidebar a'); // Select all sidebar links
          links.forEach(link => link.classList.remove('active')); // Remove 'active' class from all links
          link.classList.add('active'); // Add 'active' class to the clicked link
        }
  
        // Modify loadPage function to set the active link
        function loadPage(url) {
          document.getElementById("page-frame").src = url;
          const links = document.querySelectorAll('.sidebar a');
          links.forEach(link => {
            // If the link href matches the URL, set it as active
            if (link.getAttribute('href') === `#${url.split('.')[0]}`) {
              setActiveLink(link);
            }
          });
        }
        function toggleMenu() {
        document.querySelector('.navbar').classList.toggle('active');
        document.querySelector('.social').classList.toggle('active');
        document.querySelector('.menu-toggle').classList.toggle('hidden');
        document.querySelector('.menu-toggle1').classList.toggle('hidden');
      }
