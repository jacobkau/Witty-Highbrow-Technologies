<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Status</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; padding: 20px; text-align: center;">
        <h1 style="color: #ff6738;">✓ OK</h1>
        <p>Server is running properly</p>

        document.getElementById('time').textContent = new Date().toLocaleString();

</body>
</html>
