  <style>
    /* General Styles */

/* Overlay Effect */
.overlay1 {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 90%;
  background: rgba(0, 0, 0, 0.6);
  z-index: -1;
}

/* Container for Contact Section */
.contact-form1 {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Contact Form Section */
.contact1 {
  background: #dbe9f4;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
  text-align: center;
  width: 600px;
}

/* Contact Heading */
.contact1 h1 {
  font-family: "poppins", sans-serif;
  font-size: 24px;
  color:  #ff6738;
  margin-bottom: 20px;
}

/* Form Styling */
form {
  display: flex;
  flex-direction: column;
}

label {
  font-size: 14px;
  font-weight: bold;
  text-align: left;
  margin-bottom: 5px;
}

input,
textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
  border: 1px solid #dbe9f4;
  border-radius: 5px;
  font-size: 16px;
}

textarea {
  height: 120px;
  resize: none;
}

/* Submit Button */
button {
  background: #ff6738;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 5px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s ease;
}

button:hover {
  background: #38d7ff;
}


/* Responsive Design */
@media (max-width: 480px) {
  .contact1 {
    width: 90%;
    padding: 20px;
  }

  button {
    font-size: 16px;
  }
  .contact-form1{
    margin-top: 75px;
    margin-bottom: 40px;
  }
}
